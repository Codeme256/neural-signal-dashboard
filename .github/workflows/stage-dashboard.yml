name: Stage TradePulse dashboard
on:
  push:
    branches: [tradepulse-monthly-strength]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "742dcd3a5234c856c900ac361f8478b0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: npm test
      - run: npm run build
      - run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npx --yes wrangler@4 versions upload --name apex-signal-tank --preview-alias monthly-strength --config .output/server/wrangler.json
