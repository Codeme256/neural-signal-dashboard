name: Verify dashboard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/profile-auth-live-ui]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm test
      - run: npm run build
