name: Verify independent index alert worker
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bundle-index-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Bundle Cloudflare index alert worker (no deployment)
        run: npx --yes wrangler@4 deploy -c index-alert-service/wrangler.jsonc --dry-run --outdir /tmp/tradepulse-index-alert
